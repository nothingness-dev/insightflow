name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/ip-response-audit-export
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Django test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Settings require these to be present; test settings use SQLite and
      # an in-memory cache, so dummy values are safe - nothing here is a
      # real credential.
      SECRET_KEY: ci-only-dummy-secret-key-for-test-settings-0123456789abcdef
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      TRUST_PROXY_HEADERS: 'True'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir --timeout 300 --retries 5 -r requirements.txt

      - name: Run migrations check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run test suite
        working-directory: backend
        run: python manage.py test --settings=config.settings.test

  frontend-checks:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
