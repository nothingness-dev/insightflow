worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ── Gzip compression ──────────────────────────────────────────────────────
    # Compresses JS, CSS and JSON responses before sending them to the browser.
    # Cuts page-load transfer size by ~60-70% on a LAN with no bandwidth cost.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Real client IP ────────────────────────────────────────────────────────
    # nginx is the EDGE proxy — no upstream proxy sits in front of it.
    # On Linux, Docker's iptables DNAT preserves the original source IP so
    # $remote_addr is already the real client address. The real_ip module is
    # deliberately NOT enabled here: clients share the 172.16.0.0/12 range
    # with Docker internals, so trusting that range as a proxy would allow any
    # client to spoof its IP via a forged X-Forwarded-For header.

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # API requests → gunicorn
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Django admin
        location /django-admin/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Static files (Django collectstatic output)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # User-uploaded media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # React SPA — all other paths
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host         $host;
            proxy_set_header   X-Real-IP    $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade      $http_upgrade;
            proxy_set_header   Connection   "upgrade";
        }
    }
}
