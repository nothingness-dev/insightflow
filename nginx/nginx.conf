worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ── Real client IP ─────────────────────────────────────────────────────────
    # nginx is the EDGE proxy here — there is no upstream proxy in front of it.
    # On a Linux Docker host, iptables DNAT preserves the original source IP, so
    # $remote_addr is already the real client IP (e.g. 172.16.4.50). We therefore
    # do NOT enable the real_ip module.
    #
    # IMPORTANT: do NOT add `set_real_ip_from 172.16.0.0/12` on this network —
    # your clients live in 172.16.4.x, so trusting that range as a proxy would
    # let any client spoof its IP via a fake X-Forwarded-For header. We rely on
    # the real TCP source address instead, which cannot be spoofed.

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # API requests → gunicorn
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            # $remote_addr is the real client IP on Linux Docker (iptables DNAT).
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Django admin
        location /django-admin/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files (Django collectstatic output)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # User-uploaded media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # React frontend (SPA — all non-API paths)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host         $host;
            proxy_set_header X-Real-IP    $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade      $http_upgrade;
            proxy_set_header Connection   "upgrade";
        }
    }
}
